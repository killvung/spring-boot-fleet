services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ttc_fleet
      POSTGRES_USER: ttc_fleet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "shared_buffers=256MB", "-c", "max_connections=30"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc_fleet -d ttc_fleet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    image: ttc-fleet-service:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ttc_fleet?reWriteBatchedInserts=true&connectTimeout=5&socketTimeout=15
      DB_USERNAME: ttc_fleet
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT:-50051}
      TTC_FEED_URL: ${TTC_FEED_URL:-https://bustime.ttc.ca/gtfsrt/vehicles}
      TTC_POLL_INTERVAL: ${TTC_POLL_INTERVAL:-20s}
      TTC_CONNECT_TIMEOUT: ${TTC_CONNECT_TIMEOUT:-5s}
      TTC_READ_TIMEOUT: ${TTC_READ_TIMEOUT:-10s}
      TTC_RETENTION_DAYS: ${TTC_RETENTION_DAYS:-30}
      TTC_MAX_RECORDS: ${TTC_MAX_RECORDS:-1000}
      TTC_MAX_FEED_BYTES: ${TTC_MAX_FEED_BYTES:-8388608}
      TTC_CLEANUP_CRON: ${TTC_CLEANUP_CRON:-0 0 * * * *}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2 -Duser.timezone=UTC
    ports:
      - "${GRPC_SERVER_PORT:-50051}:${GRPC_SERVER_PORT:-50051}"
    networks:
      - database
      - egress
    mem_limit: 2g
    init: true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "java", "-Xmx64m", "-Dloader.main=ca.ttc.fleet.grpc.HealthProbe", "-cp", "/app/app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  database:
    internal: true
  egress:

volumes:
  postgres_data:
